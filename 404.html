  <style>
    :root {
      --fondo: #101114;
      --borde-hondo: #1e2025;
      --texto: #ffffff;
      --texto-chip: #d6d9df;
      --tenue-hondo: #878b95;
      --senal: #16c98d;
      --margen: clamp(16px, 4vw, 40px);
      --sora: 'Sora Variable', 'Sora', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --inter: 'Inter Variable', 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--fondo);
      color: var(--texto-chip);
      font: 400 17px/1.6 var(--inter);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }
    ::selection { background: var(--senal); color: var(--fondo); }
    header, main, footer { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 var(--margen); }
    header { padding-top: 28px; }
    header a { display: inline-block; border-radius: 8px; }
    .logo { display: block; width: 124px; height: auto; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 72px; padding-bottom: 72px; }
    .codigo {
      margin: 0 0 20px;
      font: 500 11px/1.4 var(--mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--tenue-hondo);
    }
    h1 {
      margin: 0;
      max-width: 14ch;
      font: 600 clamp(38px, 6.4vw, 78px)/1.02 var(--sora);
      letter-spacing: -0.04em;
      color: var(--texto);
      text-wrap: balance;
    }
    .bajada {
      margin: 24px 0 0;
      max-width: 36ch;
      font-size: clamp(17px, 1.7vw, 20px);
      line-height: 1.55;
    }
    .volver {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      height: 46px;
      margin-top: 40px;
      padding: 0 20px;
      border-radius: 12px;
      background: var(--texto);
      color: var(--fondo);
      font: 600 15px/1 var(--inter);
      text-decoration: none;
      transition: background-color 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .volver:hover { background: var(--texto-chip); }
    a:focus-visible { outline: 2px solid var(--senal); outline-offset: 3px; }
    footer { padding-bottom: 28px; }
    footer p {
      margin: 0;
      padding-top: 20px;
      border-top: 1px solid var(--borde-hondo);
      font-size: 14px;
      color: var(--tenue-hondo);
    }
    @media (prefers-reduced-motion: reduce) { .volver { transition: none; } }
  </style>
